<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Modifica Profilo 🐾</title>

  <!-- PWA Manifest & Icone Mobile -->
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }

    .avatar-edit-wrap {
      width: 110px;
      height: 110px;
      margin: 0 auto;
      position: relative;
    }

    .avatar-edit-circle {
      width: 110px; height: 110px;
      background: linear-gradient(45deg, #d97706, #b45309);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      border: 3px solid #fff;
      color: white;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(80, 50, 20, 0.25);
    }

    .avatar-edit-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #b45309;
      color: #fff;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    .form-label { font-weight: 600; color: #3d312a; }

    .char-counter { font-size: 0.75rem; color: #8c7a6b; }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('../../index.html');
  </script>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="../../feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <a href="../../profile.html" class="btn btn-outline-secondary btn-sm rounded-3">
        <i class="fa-solid fa-arrow-left"></i> Torna al profilo
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="glass-card p-4 mb-4">
          <h3 class="h5 fw-bold mb-4 text-dark text-center">
            <i class="fa-solid fa-user-pen" style="color:#d97706;"></i> Modifica il tuo profilo
          </h3>

          <div id="feedback-box"></div>

          <form id="edit-profile-form">

            <div class="avatar-edit-wrap mb-4">
              <div class="avatar-edit-circle" id="avatar-preview">😸</div>
              <label class="avatar-edit-btn" for="photo-input" title="Cambia foto profilo">
                <i class="fa-solid fa-camera"></i>
              </label>
              <input type="file" id="photo-input" accept="image/*" class="d-none">
            </div>

            <div class="mb-3">
              <label class="form-label" for="username-input">Nome utente</label>
              <input type="text" id="username-input" class="form-control rounded-3" maxlength="20" required>
              <div class="form-text">
                <i class="fa-solid fa-triangle-exclamation text-warning"></i>
                Se lo cambi, i post che hai già pubblicato verranno aggiornati automaticamente.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="bio-input">Bio</label>
              <textarea id="bio-input" class="form-control rounded-3" rows="3" maxlength="150" placeholder="Racconta qualcosa di te e dei gatti che cacci..."></textarea>
              <div class="char-counter text-end mt-1"><span id="bio-count">0</span>/150</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="text" id="email-display" class="form-control rounded-3" disabled>
            </div>

            <button type="submit" id="save-btn" class="btn btn-earth w-100 rounded-3 fw-bold mt-2">
              <i class="fa-solid fa-floppy-disk"></i> Salva modifiche
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const IMGBB_API_KEY = "b2bd2cbba6ca0679055dc317aa5bf613";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function setCurrentUser(user) {
      localStorage.setItem('meowgo_test_user', JSON.stringify(user));
    }

    let currentUser = getCurrentUser();
    if (!currentUser) {
      window.location.replace('../../index.html');
    }

    const usernameInput = document.getElementById('username-input');
    const bioInput = document.getElementById('bio-input');
    const bioCount = document.getElementById('bio-count');
    const emailDisplay = document.getElementById('email-display');
    const avatarPreview = document.getElementById('avatar-preview');
    const photoInput = document.getElementById('photo-input');
    const saveBtn = document.getElementById('save-btn');
    const feedbackBox = document.getElementById('feedback-box');

    let newPhotoFile = null;

    function renderAvatar(photoURL) {
      avatarPreview.innerHTML = photoURL
        ? `<img src="${photoURL}" alt="Anteprima foto profilo">`
        : '😸';
    }

    function fillForm(user) {
      usernameInput.value = user.username || '';
      bioInput.value = user.bio || '';
      bioCount.innerText = (user.bio || '').length;
      emailDisplay.value = user.email || '';
      renderAvatar(user.photoURL || '');
    }

    // Carica sempre i dati più recenti dal database, per restare sincronizzati
    async function loadFromDb() {
      try {
        const snap = await get(ref(db, `users/${currentUser.id}`));
        if (snap.exists()) {
          currentUser = { ...currentUser, ...snap.val() };
          setCurrentUser(currentUser);
        }
      } catch (err) {
        console.warn('Impossibile aggiornare dal database, uso i dati locali:', err);
      }
      fillForm(currentUser);
    }
    loadFromDb();

    bioInput.addEventListener('input', () => {
      bioCount.innerText = bioInput.value.length;
    });

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;
      newPhotoFile = file;
      renderAvatar(URL.createObjectURL(file));
    });

    function showFeedback(message, type = 'success') {
      feedbackBox.innerHTML = `
        <div class="alert alert-${type} rounded-3 py-2 small" role="alert">${message}</div>
      `;
    }

    document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newUsername = usernameInput.value.trim();
      const newBio = bioInput.value.trim();
      const oldUsername = currentUser.username;

      if (!newUsername) {
        showFeedback('Il nome utente non può essere vuoto.', 'danger');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = 'Salvataggio... ⏳';

      try {
        let photoURL = currentUser.photoURL || '';

        // Se l'utente ha scelto una nuova foto, la carica su ImgBB
        if (newPhotoFile) {
          const formData = new FormData();
          formData.append('image', newPhotoFile);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST', body: formData
          });
          const result = await response.json();
          if (!result.success) throw new Error("Errore durante il caricamento della foto profilo.");
          photoURL = result.data.url;
        }

        // Aggiorna i dati utente sul database
        const updates = {
          username: newUsername,
          bio: newBio,
          photoURL: photoURL
        };
        await update(ref(db, `users/${currentUser.id}`), updates);

        // Se lo username è cambiato, aggiorna anche i post già pubblicati con il vecchio nome
        if (newUsername !== oldUsername) {
          const catsSnap = await get(ref(db, 'cats'));
          if (catsSnap.exists()) {
            const catsData = catsSnap.val();
            const multiUpdate = {};
            for (let key in catsData) {
              if (catsData[key].author === oldUsername) {
                multiUpdate[`cats/${key}/author`] = newUsername;
              }
            }
            if (Object.keys(multiUpdate).length > 0) {
              await update(ref(db), multiUpdate);
            }
          }
        }

        currentUser = { ...currentUser, ...updates };
        setCurrentUser(currentUser);
        newPhotoFile = null;

        showFeedback('Profilo aggiornato con successo! ✅', 'success');

        setTimeout(() => {
          window.location.href = '../../profile.html';
        }, 900);

      } catch (err) {
        showFeedback('Errore: ' + err.message, 'danger');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salva modifiche';
      }
    });
  </script>
</body>
</html>
