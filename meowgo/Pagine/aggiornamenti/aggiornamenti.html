<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Aggiornamenti 🐾</title>

  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }
    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }
    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }
    .update-item {
      border-left: 3px solid #b45309;
      padding: 4px 0 4px 16px;
      margin-bottom: 18px;
    }
    .update-version {
      display: inline-block;
      background: #b45309;
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('../../index.html');
  </script>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="../../feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <a href="../../profile.html" class="btn btn-outline-secondary btn-sm rounded-3">
        <i class="fa-solid fa-arrow-left"></i> Torna al profilo
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="glass-card p-4 mb-4">
          <div class="mb-4">
            <h3 class="h5 fw-bold mb-0 text-dark">
              <i class="fa-solid fa-rotate" style="color:#d97706;"></i> Aggiornamenti
            </h3>
          </div>

          <div id="updates-list">
            <p class="text-center text-muted my-3">Caricamento aggiornamenti...</p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const listEl = document.getElementById('updates-list');

    onValue(ref(db, 'content/updates'), (snapshot) => {
      if (!snapshot.exists()) {
        listEl.innerHTML = `
          <p class="text-center text-muted my-3">Nessun aggiornamento pubblicato ancora.</p>
        `;
        return;
      }

      const data = snapshot.val();
      const updates = Object.entries(data).map(([id, u]) => ({ id, ...u }));

      // I più recenti in cima
      updates.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      listEl.innerHTML = '';
      updates.forEach(u => {
        const item = document.createElement('div');
        item.className = 'update-item';
        item.innerHTML = `
          ${u.version ? `<span class="update-version">${escapeHtml(u.version)}</span>` : ''}
          <h6 class="fw-bold mb-1">${escapeHtml(u.title || '')}</h6>
          <p class="small text-muted mb-0">${escapeHtml(u.description || '')}</p>
        `;
        listEl.appendChild(item);
      });
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
