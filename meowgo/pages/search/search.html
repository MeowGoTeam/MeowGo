<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Cerca Utenti 🐾</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        
        <div class="d-flex align-items-center mb-4">
          <a href="../feed/feed.html" class="btn btn-secondary rounded-pill px-3 me-3"><i class="fa-solid fa-arrow-left me-1"></i> Indietro</a>
          <h3 class="fw-bold mb-0"><i class="fa-solid fa-magnifying-glass text-warning me-2"></i> Cerca Profili</h3>
        </div>

        <div class="glass-card p-3 mb-4 shadow-sm">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-user text-muted"></i></span>
            <input type="text" id="search-input" class="form-control bg-transparent border-0 shadow-none fs-5" placeholder="Digita il nome utente da cercare..." autofocus>
          </div>
        </div>

        <div id="search-results" class="d-flex flex-column gap-2"></div>

      </div>
    </div>
  </div>

  <script type="module" src="module.js"></script>
</body>
</html>
