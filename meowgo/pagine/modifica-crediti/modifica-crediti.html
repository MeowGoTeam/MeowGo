<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Modifica Crediti 🐾</title>

  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }
    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }
    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }
    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }
    .form-label { font-weight: 600; color: #3d312a; }
    .manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(245, 238, 230, 0.6);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('../../index.html');
  </script>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="../../feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <a href="crediti.html" class="btn btn-outline-secondary btn-sm rounded-3">
        <i class="fa-solid fa-arrow-left"></i> Torna ai crediti
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="glass-card p-4 mb-4">
          <h3 class="h5 fw-bold mb-4 text-dark">
            <i class="fa-solid fa-pen" style="color:#d97706;"></i> <span id="form-title">Nuovo credito</span>
          </h3>

          <div id="feedback-box"></div>

          <form id="credit-form">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label class="form-label" for="icon-input">Icona (Font Awesome, es: fa-code)</label>
              <input type="text" id="icon-input" class="form-control rounded-3" placeholder="fa-code">
              <div class="form-text">Puoi cercare i nomi delle icone su fontawesome.com (versione "solid").</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="title-input">Titolo</label>
              <input type="text" id="title-input" class="form-control rounded-3" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description-input">Descrizione</label>
              <textarea id="description-input" class="form-control rounded-3" rows="2" required></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" id="save-btn" class="btn btn-earth flex-grow-1 rounded-3 fw-bold">
                <i class="fa-solid fa-floppy-disk"></i> Salva
              </button>
              <button type="button" id="cancel-edit-btn" class="btn btn-outline-secondary rounded-3 d-none">
                Annulla
              </button>
            </div>
          </form>
        </div>

        <div class="glass-card p-4 mb-4">
          <h3 class="h6 fw-bold mb-3 text-dark">Crediti pubblicati</h3>
          <div id="credits-manage-list">
            <p class="text-center text-muted my-3">Caricamento...</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('credit-form');
    const editIdInput = document.getElementById('edit-id');
    const iconInput = document.getElementById('icon-input');
    const titleInput = document.getElementById('title-input');
    const descriptionInput = document.getElementById('description-input');
    const formTitle = document.getElementById('form-title');
    const cancelBtn = document.getElementById('cancel-edit-btn');
    const feedbackBox = document.getElementById('feedback-box');
    const manageList = document.getElementById('credits-manage-list');

    function showFeedback(message, type = 'success') {
      feedbackBox.innerHTML = `<div class="alert alert-${type} rounded-3 py-2 small">${message}</div>`;
      setTimeout(() => { feedbackBox.innerHTML = ''; }, 2500);
    }

    function resetForm() {
      editIdInput.value = '';
      iconInput.value = '';
      titleInput.value = '';
      descriptionInput.value = '';
      formTitle.innerText = 'Nuovo credito';
      cancelBtn.classList.add('d-none');
    }

    cancelBtn.addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = editIdInput.value;
      const payload = {
        icon: (iconInput.value.trim() || 'fa-star'),
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim(),
        createdAt: Date.now()
      };

      try {
        if (id) {
          await update(ref(db, `content/credits/${id}`), payload);
          showFeedback('Credito modificato ✅');
        } else {
          await push(ref(db, 'content/credits'), payload);
          showFeedback('Credito pubblicato ✅');
        }
        resetForm();
      } catch (err) {
        showFeedback('Errore: ' + err.message, 'danger');
      }
    });

    window.editCredit = function(id, icon, title, description) {
      editIdInput.value = id;
      iconInput.value = icon || '';
      titleInput.value = title || '';
      descriptionInput.value = description || '';
      formTitle.innerText = 'Modifica credito';
      cancelBtn.classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteCredit = async function(id) {
      if (!confirm('Eliminare questo credito?')) return;
      try {
        await remove(ref(db, `content/credits/${id}`));
      } catch (err) {
        alert('Errore: ' + err.message);
      }
    };

    onValue(ref(db, 'content/credits'), (snapshot) => {
      if (!snapshot.exists()) {
        manageList.innerHTML = '<p class="text-center text-muted my-3">Nessun credito ancora.</p>';
        return;
      }
      const data = snapshot.val();
      const credits = Object.entries(data).map(([id, c]) => ({ id, ...c }));
      credits.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      manageList.innerHTML = '';
      credits.forEach(c => {
        const safeIcon = (c.icon || '').replace(/'/g, "\\'");
        const safeTitle = (c.title || '').replace(/'/g, "\\'");
        const safeDesc = (c.description || '').replace(/'/g, "\\'");

        const item = document.createElement('div');
        item.className = 'manage-item';
        item.innerHTML = `
          <div class="d-flex align-items-center gap-3">
            <i class="fa-solid ${c.icon || 'fa-star'}" style="color:#b45309; width:22px; text-align:center;"></i>
            <div>
              <div class="fw-bold">${c.title || ''}</div>
              <div class="small text-muted">${c.description || ''}</div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm rounded-3" onclick="editCredit('${c.id}', '${safeIcon}', '${safeTitle}', '${safeDesc}')">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm rounded-3" onclick="deleteCredit('${c.id}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        manageList.appendChild(item);
      });
    });
  </script>
</body>
</html>
