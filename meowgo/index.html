<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Accedi 🐾</title>

  <!-- PWA & Meta Tag Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeowGo">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }

    .page-section { display: none; }
    .page-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

    .auth-toggle-btn { cursor: pointer; color: #b45309; font-weight: bold; text-decoration: underline; }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="pb-5">

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4 position-relative z-3">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container position-relative z-1">
    <section id="login-page" class="page-section active">
      <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
          <div class="glass-card p-4 p-md-5 text-center">
            <div class="fs-1 mb-2">🌿🐾</div>
            <h2 class="fw-bold mb-1" id="auth-title">Accedi a MeowGo</h2>
            <p class="text-muted small mb-4" id="auth-subtitle">Accedi o registrati</p>

            <div id="auth-error" class="alert alert-danger d-none small p-2 mb-3" role="alert"></div>

            <form id="auth-form">
              <div class="form-floating mb-3 text-start d-none" id="username-container">
                <input type="text" class="form-control rounded-3" id="auth-username" placeholder="CatMaster">
                <label for="auth-username">Nome Utente (Nickname)</label>
              </div>

              <div class="form-floating mb-3 text-start">
                <input type="email" class="form-control rounded-3" id="auth-email" placeholder="nome@esempio.it" required>
                <label for="auth-email">Email</label>
              </div>

              <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control rounded-3" id="auth-password" placeholder="Password" required>
                <label for="auth-password">Password</label>
              </div>

              <button type="submit" id="auth-submit-btn" class="btn btn-earth btn-lg w-100 rounded-3 fw-bold shadow-sm">
                Accedi 🚀
              </button>
            </form>

            <div class="mt-4 pt-3 border-top small text-muted">
              <span id="auth-switch-text">Non hai ancora un account?</span>
              <span class="auth-toggle-btn" onclick="toggleAuthMode()">Registrati ora</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase & Logica di Autenticazione -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    // Importiamo le funzioni del modulo notifiche centralizzato
    import { sendWelcomeNotification, requestNotificationPermission } from "./notifications.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function setCurrentUser(user) {
      localStorage.setItem('meowgo_test_user', JSON.stringify(user));
    }

    if (getCurrentUser()) {
      window.location.replace('feed.html');
    }

    let isRegisterMode = false;

    window.toggleAuthMode = function () {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-error').classList.add('d-none');

      if (isRegisterMode) {
        document.getElementById('auth-title').innerText = "Nuova Registrazione";
        document.getElementById('auth-subtitle').innerText = "Salva utente.";
        document.getElementById('username-container').classList.remove('d-none');
        document.getElementById('auth-username').setAttribute('required', 'true');
        document.getElementById('auth-submit-btn').innerText = "Registrati Ora 🚀";
        document.getElementById('auth-switch-text').innerText = "Hai già un account?";
      } else {
        document.getElementById('auth-title').innerText = "Accedi a MeowGo";
        document.getElementById('auth-subtitle').innerText = "Verifica credenziali.";
        document.getElementById('username-container').classList.add('d-none');
        document.getElementById('auth-username').removeAttribute('required');
        document.getElementById('auth-submit-btn').innerText = "Accedi 🚀";
        document.getElementById('auth-switch-text').innerText = "Non hai ancora un account?";
      }
    };

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();
      const errorDiv = document.getElementById('auth-error');
      const submitBtn = document.getElementById('auth-submit-btn');

      errorDiv.classList.add('d-none');
      submitBtn.disabled = true;

      try {
        // Richiedi i permessi delle notifiche durante il flusso di accesso/registrazione
        await requestNotificationPermission();

        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'users'));
        const usersData = snapshot.exists() ? snapshot.val() : {};

        let currentUser;

        if (isRegisterMode) {
          for (let id in usersData) {
            if (usersData[id].email === email) throw new Error("Email già registrata!");
          }

          const newUserRef = push(ref(db, 'users'));
          const newUser = { username, email, password, xp: 0, catsFound: 0, badges: {} };

          await update(newUserRef, newUser);
          currentUser = { id: newUserRef.key, ...newUser };

          // Invia notifica di benvenuto (registrazione) gestita da notifications.js
          await sendWelcomeNotification(currentUser.id);

        } else {
          let foundUser = null;
          for (let id in usersData) {
            if (usersData[id].email === email && usersData[id].password === password) {
              foundUser = { id: id, ...usersData[id] };
              break;
            }
          }

          if (!foundUser) throw new Error("Credenziali errate o utente non trovato.");

          if (foundUser.bannedUntil) {
            const isBanned = foundUser.bannedUntil === 'indefinite' || new Date(foundUser.bannedUntil) > new Date();
            if (isBanned) {
              throw new Error(`⛔ Account Bloccato! Motivo: ${foundUser.banReason || 'Violazione delle regole'}`);
            }
          }

          currentUser = foundUser;
        }

        setCurrentUser(currentUser);
        window.location.href = 'feed.html';

      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
  <!-- Caricamento del modulo centrale delle notifiche -->
  <script type="module" src="./notifications.js"></script>
</body>
</html>
